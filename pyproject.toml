[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kengo-argus"
version = "0.1.0"
description = "Automated passive reconnaissance engine for German Mittelstand"
requires-python = ">=3.9"
dependencies = [
    "dnspython>=2.7.0",
    "requests>=2.32.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-whois>=0.9.4",
    "tqdm>=4.67.0",
]

[project.optional-dependencies]
all = [
    "shodan>=1.31.0",
    "anthropic>=0.42.0",
    "beautifulsoup4>=4.12.0",
    "aiohttp>=3.11.0",
    "jinja2>=3.1.4",
    "mmh3>=4.0.0",
    "cryptography>=42.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["argus"]

[project.scripts]
argus = "argus.cli:main"
